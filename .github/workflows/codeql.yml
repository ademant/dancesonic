name: CodeQL

# Replaces CodeQL's default setup, whose automatic build failed: it cannot install the CMake and NDK the native code
# needs. The build steps match ci.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # CodeQL has to see the Kotlin compiler run, so nothing may come from the build cache.
          cache-disabled: true

      - name: Install Android SDK packages
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "cmake;3.22.1" "ndk;$ndk" "platforms;android-37.2" > /dev/null

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
